---
# Inventory for the standalone Zabbix 7.0 LTS server.
# Replace the hostname / IP with the real RHEL 10.2 target.
all:
  children:
    zabbix_servers:
      hosts:
        zabbix01.example.com:
          ansible_host: 10.0.0.50          # Change to real IP or FQDN
          ansible_user: ansible            # SSH user with sudo rights
          ansible_connection: ssh
          ansible_become: true
          ansible_python_interpreter: /usr/bin/python3
